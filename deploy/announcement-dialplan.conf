; AMI-only context. Do not include this context in any inbound dialplan.
; The sidecar supplies an immutable job ID and deadline before originating.
[cisco-announcement]
exten => _2XX,1,NoOp(Finite phone announcement)
 same => n,GotoIf($[${REGEX("^[0-9a-f]{32}$" ${ANNOUNCE_JOB})} != 1]?reject)
 same => n,GotoIf($["${ANNOUNCE_LINE}" != "${EXTEN}"]?reject)
 same => n,GotoIf($[${REGEX("^[0-9]{10}$" ${ANNOUNCE_END})} != 1]?reject)
 same => n,Set(ANNOUNCE_REMAINING=$[${ANNOUNCE_END}-${EPOCH}])
 same => n,GotoIf($[${ANNOUNCE_REMAINING} <= 0 | ${ANNOUNCE_REMAINING} > 180]?reject)
 same => n,Set(TIMEOUT(absolute)=${ANNOUNCE_REMAINING})
 same => n,Dial(PJSIP/${EXTEN},30,ib(cisco-announcement-guard^s^1))
 same => n,Hangup()
 same => n(reject),Hangup(21)

; Also arm the real PJSIP leg: Local-channel or sidecar failure cannot leave
; an unbounded call. The Dial i option ignores endpoint call-forward requests.
[cisco-announcement-guard]
exten => s,1,Set(ANNOUNCE_REMAINING=$[${ANNOUNCE_END}-${EPOCH}])
 same => n,GotoIf($[${ANNOUNCE_REMAINING} <= 0 | ${ANNOUNCE_REMAINING} > 180]?reject)
 same => n,Set(TIMEOUT(absolute)=${ANNOUNCE_REMAINING})
 same => n,Return()
 same => n(reject),Hangup(21)
