<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Physical Cisco phone volume control</title>
  <desc id="desc">CLI and Home Assistant request one to five volume key presses. The gateway checks the physical phone and activity context. On-hook idle volume changes the ringer; during a call it changes the audio output already in use. No absolute level is read back, and digital player gain remains separate.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0c2036"/><stop offset="1" stop-color="#182e49"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#9ab9d0"/></marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="url(#background)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="52" fill="#ffffff" font-size="30" font-weight="700">Adjust the phone, one physical key press at a time</text>
    <text x="42" y="82" fill="#bdd0e2" font-size="17">Relative steps for the ringer or current call output · no invented volume percentage</text>

    <g stroke="#9ab9d0" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
      <path d="M354 202H397"/>
      <path d="M750 202H793"/>
    </g>
    <rect x="42" y="120" width="312" height="168" rx="16" fill="#193958" stroke="#58aaff" stroke-width="2"/>
    <rect x="402" y="120" width="348" height="168" rx="16" fill="#173c43" stroke="#59d4bd" stroke-width="2"/>
    <rect x="798" y="120" width="360" height="168" rx="16" fill="#3c3155" stroke="#bc9cf5" stroke-width="2"/>
    <g font-size="21" font-weight="700">
      <text x="62" y="155" fill="#8cc6ff">1 · CLI or Home Assistant</text>
      <text x="422" y="155" fill="#85e7d3">2 · Gateway checks</text>
      <text x="818" y="155" fill="#d2bafd">3 · Cisco volume keys</text>
    </g>
    <g font-size="17" fill="#edf4fa">
      <text x="62" y="188">Choose ringer or call</text>
      <text x="62" y="216">Up or down · 1–5 steps</text>
      <text x="62" y="254" fill="#bdd0e2">Both lines map to one phone</text>
      <text x="422" y="188">Online phone + current context</text>
      <text x="422" y="216">Calls and protected activity</text>
      <text x="422" y="254" fill="#bdd0e2">No automatic voice interruption</text>
      <text x="818" y="188" font-family="monospace">Key:VolUp / Key:VolDwn</text>
      <text x="818" y="216">Same action as the volume rocker</text>
      <text x="818" y="254" fill="#bdd0e2">Acknowledgement ≠ level readback</text>
    </g>

    <text x="42" y="328" fill="#ffffff" font-size="21" font-weight="700">The phone's current audio context decides what changes</text>
    <rect x="42" y="350" width="538" height="166" rx="16" fill="#163d4d" stroke="#56c5e7" stroke-width="2"/>
    <rect x="620" y="350" width="538" height="166" rx="16" fill="#463c28" stroke="#efbc65" stroke-width="2"/>
    <text x="64" y="387" fill="#8be2fb" font-size="22" font-weight="700">Ringer · on-hook and idle</text>
    <text x="642" y="387" fill="#ffdc9b" font-size="22" font-weight="700">Call · the output already in use</text>
    <g font-size="17" fill="#edf4fa">
      <text x="64" y="419">Handset in cradle; speaker/headset audio off</text>
      <text x="64" y="447">PBX idleness does not prove the hook state</text>
      <text x="64" y="486" font-family="monospace" font-size="16">cisco 212 volume ringer up --steps 2</text>
      <text x="642" y="419">Handset OR headset OR speakerphone</text>
      <text x="642" y="447">No output switching or automatic Save press</text>
      <text x="642" y="486" font-family="monospace" font-size="16">cisco 212 volume call down</text>
    </g>

    <rect x="42" y="546" width="1116" height="72" rx="12" fill="#4a2e3b"/>
    <text x="62" y="577" fill="#ffc8d2" font-size="19" font-weight="700">Unknown or partial result? Inspect the phone before sending more steps.</text>
    <text x="62" y="602" fill="#f2d6dd" font-size="16">A lost response can hide a completed key press. Retrying can increase or decrease the level again.</text>
    <text x="42" y="655" fill="#c8d9e7" font-size="17">HA media-player slider = digital stream gain. These buttons = physical phone volume.</text>
    <text x="42" y="687" fill="#9eb7cd" font-size="16">Future-call persistence may need the phone's visible Save softkey. No absolute or per-output readback.</text>
  </g>
</svg>
