<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">630: голосовой помощник в телефоне</title><desc id="desc">Asterisk преобразует G.711 Cisco в Opus для встроенной VoIP интеграции Home Assistant. AMI не передаёт голос. Реальный звук и распознавание проверяют на пилотном телефоне.</desc><defs><marker id="arrow-48DDCC" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#48DDCC"/></marker><marker id="arrow-FF836D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#FF836D"/></marker><marker id="arrow-F7CB64" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#F7CB64"/></marker></defs><rect width="1280" height="720" fill="#101C34"/><text x="45" y="55" font-family="Arial, sans-serif" font-size="34" fill="#F5F7FB" font-weight="700" text-anchor="start"><tspan x="45" dy="0">630: голосовой помощник в телефоне</tspan></text><path d="M325,280 L480,280" fill="none" stroke="#48DDCC" stroke-width="3" marker-start="url(#arrow-48DDCC)" marker-end="url(#arrow-48DDCC)"/><text x="402" y="180" font-family="Arial, sans-serif" font-size="19" fill="#48DDCC" font-weight="400" text-anchor="middle"><tspan x="402" dy="0">SIP TCP</tspan><tspan x="402" dy="24.7">RTP</tspan></text><path d="M795,280 L950,280" fill="none" stroke="#F7CB64" stroke-width="3" marker-start="url(#arrow-F7CB64)" marker-end="url(#arrow-F7CB64)"/><text x="873" y="180" font-family="Arial, sans-serif" font-size="19" fill="#F7CB64" font-weight="400" text-anchor="middle"><tspan x="873" dy="0">SIP UDP</tspan><tspan x="873" dy="24.7">RTP</tspan></text><rect x="45" y="210" width="280" height="140" rx="10" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="185" y="256" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="185" dy="0">Cisco 7945G</tspan><tspan x="185" dy="31.200000000000003">номер 201</tspan><tspan x="185" dy="31.200000000000003">G.711</tspan></text><rect x="480" y="210" width="315" height="140" rx="10" fill="#172841" stroke="#FF836D" stroke-width="2"/><text x="637.5" y="256" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="637.5" dy="0">Asterisk</tspan><tspan x="637.5" dy="31.200000000000003">G.711 ↔ Opus</tspan><tspan x="637.5" dy="31.200000000000003">номер 630</tspan></text><rect x="950" y="210" width="285" height="140" rx="10" fill="#172841" stroke="#F7CB64" stroke-width="2"/><text x="1092.5" y="256" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="1092.5" dy="0">Home Assistant</tspan><tspan x="1092.5" dy="31.200000000000003">VoIP / Assist</tspan><tspan x="1092.5" dy="31.200000000000003">Opus</tspan></text><text x="45" y="463" font-family="Arial, sans-serif" font-size="28" fill="#F5F7FB" font-weight="400" text-anchor="start"><tspan x="45" dy="0">Первый вызов: Allow calls и выбор pipeline в HA.</tspan><tspan x="45" dy="36.4">Затем проверка распознавания, ответа TTS и завершения.</tspan></text><text x="45" y="660" font-family="Arial, sans-serif" font-size="19" fill="#AAB9D0" font-weight="400" text-anchor="start"><tspan x="45" dy="0">SIP From сохраняет номер телефона. На HA RTP / RTCP используют динамические UDP-порты.</tspan><tspan x="45" dy="24.7">Настоящий разговор подтверждает пилот с телефоном, а не только readiness Pod.</tspan></text></svg>
