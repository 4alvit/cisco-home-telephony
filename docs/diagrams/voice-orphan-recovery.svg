<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Exact-session administrative recovery</title>
  <desc id="desc">Disabled policy, exact owner checks, bounded network quiescence, and private archive precede release. Automatic listening stays off and the historical Stop remains unconfirmed.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102b46"/><stop offset="1" stop-color="#18243d"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8bb8cf"/></marker>
  </defs>
  <rect width="1000" height="420" rx="20" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="36" y="49" fill="#fff" font-size="27" font-weight="700">Recover the reservation. Preserve the evidence.</text>
    <text x="36" y="79" fill="#c4d8e9" font-size="16">A deliberate administrative action for one ownerless SIP session</text>
    <g stroke="#8bb8cf" stroke-width="2" marker-end="url(#arrow)">
      <path d="M251 183H277"/><path d="M491 183H517"/><path d="M731 183H757"/>
    </g>
    <g fill="#193f57" stroke="#46b6b1" stroke-width="2">
      <rect x="36" y="115" width="215" height="137" rx="12"/>
      <rect x="276" y="115" width="215" height="137" rx="12"/>
      <rect x="516" y="115" width="215" height="137" rx="12"/>
      <rect x="756" y="115" width="208" height="137" rx="12"/>
    </g>
    <g fill="#7ee1d7" font-size="18" font-weight="700">
      <text x="53" y="148">1 · Disable intent</text><text x="293" y="148">2 · Fence ownership</text>
      <text x="533" y="148">3 · Prove quiescence</text><text x="773" y="148">4 · Archive + release</text>
    </g>
    <g fill="#e2edf5" font-size="15">
      <text x="53" y="179">No pending call ticket</text><text x="53" y="204">Read exact session + hash</text><text x="53" y="229">Wait owner grace period</text>
      <text x="293" y="179">Existing phone lease</text><text x="293" y="204">No live / successor owner</text><text x="293" y="229">Compare journals + cache</text>
      <text x="533" y="179">Both aliases idle</text><text x="533" y="204">Five inactive streams</text><text x="533" y="229">Two stable observations</text>
      <text x="773" y="179">Private originals + proof</text><text x="773" y="204">Failed, now unreserved</text><text x="773" y="229">Listening remains OFF</text>
    </g>
    <rect x="36" y="278" width="928" height="52" rx="10" fill="#533c2d"/>
    <text x="56" y="310" fill="#ffdb9a" font-size="17">Any active, changed, missing or timed-out evidence → keep the reservation</text>
    <text x="36" y="365" fill="#c4d8e9" font-size="16">Historical Stop remains unconfirmed. Network quiescence does not measure microphone power.</text>
    <text x="36" y="391" fill="#8caabe" font-size="14">Success never automatically enables listening; acoustic qualification is a separate check.</text>
  </g>
</svg>
