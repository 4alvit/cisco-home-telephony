<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1250" role="img" aria-labelledby="title desc">
  <title id="title">Fictional room directory: ten example phones and a separate Mac</title>
  <desc id="desc">A fictional demonstration independent of any private household directory. The private inventory supplies room names to Asterisk caller IDs and gateway metadata, then the read-only CLI directory. Example Rooms A through J illustrate ten two-line phones. Operator's Mac illustrates a separate software client. All real room assignments, personal device names and physical identities remain private. Numeric labels and SIP credentials stay unchanged when room metadata changes.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#48DDCC"/></marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #F5F7FB; }
      .muted { fill: #ACBBD0; }
      .teal { fill: #48DDCC; }
      .gold { fill: #F7CB64; }
      .mono { font-family: monospace; }
    </style>
  </defs>
  <rect width="1440" height="1250" fill="#101C34"/>
  <text x="48" y="62" font-size="38" font-weight="700">Fictional directory. Real assignments stay private.</text>
  <text x="48" y="103" font-size="22" class="muted">Example names and numbers illustrate the feature; this is not a household map.</text>

  <rect x="48" y="139" width="400" height="122" rx="14" fill="#172841" stroke="#48DDCC" stroke-width="2"/>
  <text x="72" y="176" font-size="19" class="teal">1  CENTRAL PRIVATE INVENTORY</text>
  <text x="72" y="213" font-size="23">phones[].room / softphones[].room</text>
  <text x="72" y="242" font-size="18" class="muted">Keep real identities and credentials private</text>
  <path d="M450,200 H494" stroke="#48DDCC" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="506" y="139" width="428" height="122" rx="14" fill="#172841" stroke="#48DDCC" stroke-width="2"/>
  <text x="530" y="176" font-size="19" class="teal">2  GENERATE + REVIEW + DEPLOY</text>
  <text x="530" y="213" font-size="23">PJSIP caller ID + gateway room</text>
  <text x="530" y="242" font-size="18" class="muted">Numeric handset labels remain unchanged</text>
  <path d="M936,200 H980" stroke="#48DDCC" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="992" y="139" width="400" height="122" rx="14" fill="#172841" stroke="#48DDCC" stroke-width="2"/>
  <text x="1016" y="176" font-size="19" class="teal">3  READ THE DIRECTORY</text>
  <text x="1016" y="213" font-size="24" class="mono">cisco directory</text>
  <text x="1016" y="242" font-size="18" class="muted">Room + line mapping + observed availability</text>

  <text x="48" y="309" font-size="26" font-weight="700">Ten fictional Cisco destinations</text>
  <text x="1392" y="307" font-size="18" text-anchor="end" class="muted">Demonstration only · private inventory is authoritative</text>
