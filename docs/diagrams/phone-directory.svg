  <rect x="48" y="960" width="1344" height="108" rx="14" fill="#263247" stroke="#F7CB64" stroke-width="2"/>
  <text x="76" y="1000" font-size="26" font-weight="700" class="gold">209 · Operator's Mac</text>
  <text x="76" y="1039" font-size="21">Separate software client · directory entry and call destination · no Cisco device controls</text>

  <rect x="48" y="1100" width="1344" height="112" rx="14" fill="#172841"/>
  <text x="72" y="1135" font-size="21" font-weight="700">A room assignment is not a SIP account, registration check or voicemail directory.</text>
  <text x="72" y="1170" font-size="20" class="muted">Both lines keep their own extension and password. A disconnected phone retains its assigned room.</text>
  <text x="72" y="1198" font-size="20" class="muted">Room-only server updates need no firmware flash, TFTP window, PoE cycle or handset reset.</text>
