<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="250" viewBox="0 0 1040 250" role="img" aria-labelledby="title desc"><title id="title">Public RC fuzz assessment</title><desc id="desc">Explicit RC dispatch from the public default branch runs locked, instrumented targets for two minutes and retains source-bound evidence. Product releases remain separate.</desc><rect width="1040" height="250" rx="18" fill="#f1f6fc"/><g font-family="Arial,sans-serif" fill="#20324b"><text x="28" y="38" font-size="22" font-weight="bold">Public RC fuzz assessment</text><g fill="#fff" stroke="#bbcade"><rect x="28" y="62" width="220" height="105" rx="12"/><rect x="280" y="62" width="220" height="105" rx="12"/><rect x="532" y="62" width="220" height="105" rx="12"/><rect x="784" y="62" width="228" height="105" rx="12"/></g><g font-size="17" font-weight="bold"><text x="44" y="94" fill="#4058b5">1. Explicit RC</text><text x="296" y="94" fill="#26775e">2. Real parsers</text><text x="548" y="94" fill="#975c07">3. Bounded mutation</text><text x="800" y="94" fill="#7147a5">4. Evidence</text></g><g font-size="14"><text x="44" y="123">Public default branch</text><text x="44" y="147">channel=rc</text><text x="296" y="123">Locked fuzz tools</text><text x="296" y="147">Seeds + invariants</text><text x="548" y="123">2 targets × 60 seconds</text><text x="548" y="147">Isolated execution</text><text x="800" y="123">Source SHA + run ID</text><text x="800" y="147">Crashes + report</text></g><g fill="#6b829e" font-size="22"><text x="256" y="122">→</text><text x="508" y="122">→</text><text x="760" y="122">→</text></g><text x="28" y="207" font-size="15">No mutation on PRs, ordinary pushes, beta releases or schedules.</text><text x="28" y="231" font-size="14" fill="#526782">Passing this assessment does not publish a release or establish physical-device acceptance.</text></g></svg>
