<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">7945G поддерживает PoE без переделки</title><desc id="desc">802.3af уже встроен в телефон. При отсутствии PoE у коммутатора добавьте активный IEEE 802.3af-инжектор.</desc><defs><marker id="arrow-48DDCC" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#48DDCC"/></marker><marker id="arrow-FF836D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#FF836D"/></marker><marker id="arrow-F7CB64" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#F7CB64"/></marker></defs><rect width="1280" height="720" fill="#101C34"/><text x="45" y="55" font-family="Arial, sans-serif" font-size="34" fill="#F5F7FB" font-weight="700" text-anchor="start"><tspan x="45" dy="0">7945G поддерживает PoE без переделки</tspan></text><path d="M360,245 L900,245" fill="none" stroke="#48DDCC" stroke-width="3"  marker-end="url(#arrow-48DDCC)"/><text x="630" y="229" font-family="Arial, sans-serif" font-size="19" fill="#48DDCC" font-weight="400" text-anchor="middle"><tspan x="630" dy="0">данные + питание</tspan></text><path d="M360,497.5 L480,497.5" fill="none" stroke="#F7CB64" stroke-width="3"  marker-end="url(#arrow-F7CB64)"/><text x="420" y="481.5" font-family="Arial, sans-serif" font-size="19" fill="#F7CB64" font-weight="400" text-anchor="middle"><tspan x="420" dy="0">данные</tspan></text><path d="M780,497.5 L900,497.5" fill="none" stroke="#48DDCC" stroke-width="3"  marker-end="url(#arrow-48DDCC)"/><text x="840" y="481.5" font-family="Arial, sans-serif" font-size="19" fill="#48DDCC" font-weight="400" text-anchor="middle"><tspan x="840" dy="0">PoE</tspan></text><rect x="60" y="185" width="300" height="120" rx="10" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="210" y="237" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="210" dy="0">PoE-коммутатор</tspan><tspan x="210" dy="31.200000000000003">IEEE 802.3af</tspan></text><rect x="900" y="185" width="310" height="120" rx="10" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="1055" y="237" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="1055" dy="0">Cisco 7945G</tspan><tspan x="1055" dy="31.200000000000003">порт SW / Network</tspan></text><rect x="60" y="440" width="300" height="115" rx="10" fill="#172841" stroke="#F7CB64" stroke-width="2"/><text x="210" y="489.5" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="210" dy="0">Обычный коммутатор</tspan><tspan x="210" dy="31.200000000000003">Ethernet</tspan></text><rect x="480" y="440" width="300" height="115" rx="10" fill="#172841" stroke="#FF836D" stroke-width="2"/><text x="630" y="489.5" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="630" dy="0">Активный инжектор</tspan><tspan x="630" dy="31.200000000000003">IEEE 802.3af</tspan></text><rect x="900" y="440" width="310" height="115" rx="10" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="1055" y="489.5" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="1055" dy="0">Cisco 7945G</tspan><tspan x="1055" dy="31.200000000000003">порт SW / Network</tspan></text><text x="45" y="660" font-family="Arial, sans-serif" font-size="19" fill="#AAB9D0" font-weight="400" text-anchor="start"><tspan x="45" dy="0">Пассивный 24 V инжектор не подходит. UPS питает также PoE-коммутатор, маршрутизатор и k3s-узел.</tspan></text></svg>
