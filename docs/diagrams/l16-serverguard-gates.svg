<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1120" viewBox="0 0 1120 1120" role="img" aria-labelledby="title desc">
  <title id="title">L16 acceptance: four sequential evidence gates</title>
  <desc id="desc">First test the protocol with offline synthetic fixtures, then test media through a disposable actual Asterisk instance, then qualify the full serverguard against controller death and stall, a held-open media worker, exact two-leg cleanup, a healthy unrelated sentinel, and one-use, reload and restart behavior. A coordinated owner may manually run a separately scoped physical phone pilot. Synthetic success does not prove actual PBX behavior; media success does not prove the full guard; full guard success does not prove phone L16 interoperability, audio, acoustics or a native application. This process diagram asserts no current pass status and never automatically triggers a phone pilot.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#b6d1e4"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #ecf6ff; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #c4d8e8; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .number { font-size: 24px; font-weight: 700; fill: #0b192b; text-anchor: middle; }
      .divider { stroke: #7391a9; stroke-opacity: 0.5; }
      .flow { stroke: #b6d1e4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="1120" rx="24" fill="#0b192b"/>
  <text x="36" y="52" class="title">L16: four gates, four different kinds of evidence</text>
  <text x="36" y="84" class="body">Advance only with the evidence required for that gate.</text>
  <text x="36" y="113" class="small">Process diagram — no current PASS status is asserted.</text>

  <path d="M74 210V360" class="flow"/>
  <path d="M74 405V550" class="flow"/>
  <path d="M74 595V805" class="flow"/>

  <rect x="124" y="150" width="956" height="165" rx="18" fill="#113d48" stroke="#4bd7c8" stroke-width="2"/>
  <circle cx="74" cy="188" r="23" fill="#4bd7c8"/>
  <text x="74" y="196" class="number">1</text>
  <text x="148" y="188" class="heading">Offline synthetic protocol test</text>
  <text x="148" y="224" class="body">Synthetic fixtures and deterministic checks</text>
  <text x="148" y="254" class="body">Protocol framing, PCM and clock expectations</text>
  <text x="148" y="286" class="small">No actual PBX or physical phone is exercised.</text>
  <line x1="718" y1="172" x2="718" y2="292" class="divider"/>
  <text x="742" y="190" class="label">EVIDENCE BOUNDARY</text>
  <text x="742" y="228" class="heading">Synthetic PASS</text>
  <text x="742" y="259" class="body">≠ actual PBX behavior</text>

  <rect x="124" y="345" width="956" height="165" rx="18" fill="#233967" stroke="#8eaaff" stroke-width="2"/>
  <circle cx="74" cy="383" r="23" fill="#8eaaff"/>
  <text x="74" y="391" class="number">2</text>
  <text x="148" y="383" class="heading">Disposable actual Asterisk media test</text>
  <text x="148" y="419" class="body">Run the real PBX with local synthetic peers.</text>
  <text x="148" y="449" class="body">Verify negotiated formats and media each way.</text>
  <text x="148" y="481" class="small">A disposable media lab still has no physical phone.</text>
  <line x1="718" y1="367" x2="718" y2="487" class="divider"/>
  <text x="742" y="385" class="label">EVIDENCE BOUNDARY</text>
  <text x="742" y="423" class="heading">Media PASS</text>
  <text x="742" y="454" class="body">≠ full serverguard qualification</text>

  <rect x="124" y="540" width="956" height="225" rx="18" fill="#41305c" stroke="#caa0ff" stroke-width="2"/>
  <circle cx="74" cy="578" r="23" fill="#caa0ff"/>
  <text x="74" y="586" class="number">3</text>
  <text x="148" y="578" class="heading">Full serverguard failure qualification</text>
  <text x="148" y="614" class="body">Controller death/stall; held-open media worker</text>
  <text x="148" y="644" class="body">Exact cleanup of both owned call legs</text>
  <text x="148" y="674" class="body">Unrelated sentinel remains healthy</text>
  <text x="148" y="704" class="body">One-use enforcement, reload and restart</text>
  <text x="148" y="739" class="small">Media success alone cannot establish these properties.</text>
  <line x1="718" y1="562" x2="718" y2="742" class="divider"/>
  <text x="742" y="580" class="label">EVIDENCE BOUNDARY</text>
  <text x="742" y="618" class="heading">Full guard PASS</text>
  <text x="742" y="649" class="body">≠ phone L16 interoperability</text>
  <text x="742" y="679" class="body">≠ phone audio or acoustics</text>
  <text x="742" y="709" class="body">≠ a native phone application</text>

  <rect x="124" y="795" width="956" height="200" rx="18" fill="#43371e" stroke="#efc778" stroke-width="2"/>
  <circle cx="74" cy="833" r="23" fill="#efc778"/>
  <text x="74" y="841" class="number">4</text>
  <text x="148" y="833" class="heading">Separately coordinated physical phone pilot</text>
  <text x="148" y="869" class="body">Coordinated owner and explicit test scope</text>
  <text x="148" y="899" class="body">Manual start within an agreed, bounded window</text>
  <text x="148" y="929" class="body">Verify real firmware, L16 media and listening.</text>
  <text x="148" y="967" class="small">Record transport, cleanup and acoustic results separately.</text>
  <line x1="718" y1="817" x2="718" y2="972" class="divider"/>
  <text x="742" y="835" class="label">MANUAL COORDINATION GATE</text>
  <text x="742" y="873" class="heading">No automatic trigger</text>
  <text x="742" y="904" class="body">Earlier success never starts</text>
  <text x="742" y="934" class="body">a call on a physical phone.</text>

  <rect x="36" y="1027" width="1044" height="57" rx="13" fill="#10243a" stroke="#6388a6"/>
  <text x="58" y="1062" class="body">Each gate needs its own recorded result. Passing one gate does not silently pass the next.</text>
</svg>
