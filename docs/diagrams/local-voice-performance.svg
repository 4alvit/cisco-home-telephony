<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="970" viewBox="0 0 1320 970" role="img" aria-labelledby="title desc">
<title id="title">Local voice latency: seven saved synthetic trials</title>
<desc id="desc">Stacked timelines from activation to final cleanup. Six repeated short responses take 17.07 to 21.27 seconds. One distinct longer response takes 27.10 seconds, including 3.91 seconds of audio fetch. Speech recognition includes overlapping input and endpointing. No physical phone or acoustic delay is measured.</desc>
