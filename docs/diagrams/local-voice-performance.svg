<text x="70" y="837" class="label">Recognition and conversation account for 84.7% of the six repeated trials’ total elapsed time.</text>
<text x="70" y="866" class="small muted">Input pacing overlaps setup/STT. Fetch position within post-close work is schematic; its duration is measured.</text>
<text x="70" y="894" class="small muted">No phone, microphone, acoustic latency, cold-start guarantee or tail-latency estimate. The distinct reply is longer.</text>
<text x="48" y="950" class="small muted">Observed October 19, 2026 (local date) • Per-trial segments add exactly; medians are not additive.</text>
