<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Cisco, Asterisk and Home Assistant</title><desc id="desc">PoE powers the phones, which call through Asterisk. Home Assistant connects to AMI. Assist receives SIP/RTP from Asterisk. The existing DHCP server remains in use. TFTP runs only during provisioning.</desc><defs><marker id="arrow-48DDCC" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#48DDCC"/></marker><marker id="arrow-FF836D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#FF836D"/></marker><marker id="arrow-F7CB64" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#F7CB64"/></marker></defs><rect width="1280" height="720" fill="#101C34"/><text x="45" y="55" font-family="Arial, sans-serif" font-size="34" fill="#F5F7FB" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Cisco, Asterisk and Home Assistant</tspan></text><path d="M310,245 L455,245" fill="none" stroke="#48DDCC" stroke-width="3" marker-start="url(#arrow-48DDCC)" marker-end="url(#arrow-48DDCC)"/><text x="382.5" y="229" font-family="Arial, sans-serif" font-size="19" fill="#48DDCC" font-weight="400" text-anchor="middle"><tspan x="382.5" dy="0">Ethernet</tspan></text><path d="M745,245 L900,245" fill="none" stroke="#48DDCC" stroke-width="3" marker-start="url(#arrow-48DDCC)" marker-end="url(#arrow-48DDCC)"/><text x="822.5" y="229" font-family="Arial, sans-serif" font-size="19" fill="#48DDCC" font-weight="400" text-anchor="middle"><tspan x="822.5" dy="0">SIP / RTP</tspan></text><path d="M600,440 L600,305" fill="none" stroke="#F7CB64" stroke-width="3"  marker-end="url(#arrow-F7CB64)"/><text x="665" y="382" font-family="Arial, sans-serif" font-size="19" fill="#F7CB64" font-weight="400" text-anchor="middle"><tspan x="665" dy="0">DHCP</tspan></text><path d="M177.5,440 L177.5,305" fill="none" stroke="#FF836D" stroke-width="3"  marker-end="url(#arrow-FF836D)"/><text x="235" y="382" font-family="Arial, sans-serif" font-size="19" fill="#FF836D" font-weight="400" text-anchor="middle"><tspan x="235" dy="0">download</tspan></text><path d="M1065,305 L1065,440" fill="none" stroke="#F7CB64" stroke-width="3" marker-start="url(#arrow-F7CB64)" marker-end="url(#arrow-F7CB64)"/><text x="1160" y="360" font-family="Arial, sans-serif" font-size="19" fill="#F7CB64" font-weight="400" text-anchor="middle"><tspan x="1160" dy="0">AMI</tspan><tspan x="1160" dy="24.7">SIP / RTP</tspan></text><rect x="45" y="185" width="265" height="120" rx="10" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="177.5" y="237" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="177.5" dy="0">10 × Cisco 7945G</tspan><tspan x="177.5" dy="31.200000000000003">PoE 802.3af</tspan></text><rect x="455" y="185" width="290" height="120" rx="10" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="600" y="237" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="600" dy="0">PoE switch</tspan><tspan x="600" dy="31.200000000000003">Voice LAN / VLAN</tspan></text><rect x="900" y="185" width="330" height="120" rx="10" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="1065" y="237" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="1065" dy="0">Asterisk / PJSIP</tspan><tspan x="1065" dy="31.200000000000003">static IP</tspan></text><rect x="455" y="440" width="290" height="110" rx="10" fill="#172841" stroke="#F7CB64" stroke-width="2"/><text x="600" y="487" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="600" dy="0">Router</tspan><tspan x="600" dy="31.200000000000003">DHCP option 150</tspan></text><rect x="45" y="440" width="265" height="110" rx="10" fill="#172841" stroke="#FF836D" stroke-width="2"/><text x="177.5" y="487" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="177.5" dy="0">Temporary TFTP</tspan><tspan x="177.5" dy="31.200000000000003">firmware and XML</tspan></text><rect x="900" y="440" width="330" height="110" rx="10" fill="#172841" stroke="#F7CB64" stroke-width="2"/><text x="1065" y="487" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="1065" dy="0">Home Assistant</tspan><tspan x="1065" dy="31.200000000000003">AMI + VoIP / Assist</tspan></text><text x="45" y="660" font-family="Arial, sans-serif" font-size="19" fill="#AAB9D0" font-weight="400" text-anchor="start"><tspan x="45" dy="0">Asterisk uses hostNetwork and one replica. HA opens the AMI connection to the PBX.</tspan><tspan x="45" dy="24.7">TFTP runs only during provisioning. SIP, RTP and AMI stay on the LAN / VPN.</tspan></text></svg>
