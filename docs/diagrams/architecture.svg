<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Cisco 7945G в домашней сети</title><desc id="desc">Телефоны подключаются к одному LAN-адресу k3s-узла. Существующий маршрутизатор раздаёт DHCP. TFTP работает только при provisioning.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="context-stroke"/></marker></defs><rect width="1280" height="720" fill="#101C34"/><text x="45" y="55" font-family="Arial, sans-serif" font-size="34" fill="#F5F7FB" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Cisco 7945G в домашней сети</tspan></text><rect x="820" y="180" width="390" height="390" rx="12" fill="none" stroke="#AAB9D0" stroke-dasharray="7 7"/><text x="836" y="212" font-family="Arial, sans-serif" font-size="20" fill="#AAB9D0" font-weight="400" text-anchor="start"><tspan x="836" dy="0">k3s: фиксированный LAN-узел</tspan></text><path d="M295,350 L350,350" fill="none" stroke="#48DDCC" stroke-width="3" marker-end="url(#arrow)"/><path d="M482.5,220 L482.5,290" fill="none" stroke="#F7CB64" stroke-width="3" marker-end="url(#arrow)"/><text x="540" y="260" font-family="Arial, sans-serif" font-size="19" fill="#F7CB64" font-weight="400" text-anchor="middle"><tspan x="540" dy="0">DHCP</tspan></text><path d="M615,350 H722.5 V300 H830" fill="none" stroke="#48DDCC" stroke-width="3" marker-end="url(#arrow)"/><text x="735" y="263" font-family="Arial, sans-serif" font-size="19" fill="#48DDCC" font-weight="400" text-anchor="middle"><tspan x="735" dy="0">SIP + RTP</tspan></text><path d="M615,350 H722.5 V497.5 H830" fill="none" stroke="#FF836D" stroke-width="3" marker-end="url(#arrow)"/><text x="760" y="425" font-family="Arial, sans-serif" font-size="19" fill="#FF836D" font-weight="400" text-anchor="middle"><tspan x="760" dy="0">загрузка</tspan></text><rect x="50" y="290" width="245" height="120" rx="10" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="172.5" y="342" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="172.5" dy="0">10 × Cisco 7945G</tspan><tspan x="172.5" dy="31.200000000000003">PoE 802.3af</tspan></text><rect x="350" y="290" width="265" height="120" rx="10" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="482.5" y="342" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="482.5" dy="0">Коммутатор PoE</tspan><tspan x="482.5" dy="31.200000000000003">Voice LAN / VLAN</tspan></text><rect x="350" y="120" width="265" height="100" rx="10" fill="#172841" stroke="#F7CB64" stroke-width="2"/><text x="482.5" y="162" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="482.5" dy="0">Маршрутизатор</tspan><tspan x="482.5" dy="31.200000000000003">DHCP option 150</tspan></text><rect x="830" y="235" width="365" height="130" rx="10" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="1012.5" y="276" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="1012.5" dy="0">Asterisk / PJSIP</tspan><tspan x="1012.5" dy="31.200000000000003">SIP TCP+UDP 5060</tspan><tspan x="1012.5" dy="31.200000000000003">RTP UDP 10000–10199</tspan></text><rect x="830" y="445" width="365" height="105" rx="10" fill="#172841" stroke="#FF836D" stroke-width="2"/><text x="1012.5" y="489.5" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="1012.5" dy="0">TFTP временно</tspan><tspan x="1012.5" dy="31.200000000000003">UDP 69 + 20000–20031</tspan></text><text x="45" y="660" font-family="Arial, sans-serif" font-size="19" fill="#AAB9D0" font-weight="400" text-anchor="start"><tspan x="45" dy="0">hostNetwork · одна реплика Asterisk · постоянный LAN IP · без Ingress для SIP/RTP</tspan></text></svg>
