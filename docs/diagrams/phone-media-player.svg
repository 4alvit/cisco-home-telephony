<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Controlled Cisco media playback</title><desc id="desc">Home Assistant and Music Assistant feed an authenticated gateway that controls a bounded audio decoder, an exact AudioSocket call, and a Cisco phone. Metadata returns to Home Assistant.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs>
<rect width="1120" height="560" rx="24" fill="#0f172a"/><g font-family="Arial,sans-serif" fill="#f8fafc"><text x="40" y="55" font-size="28" font-weight="bold">One phone · one controlled media session</text><text x="40" y="88" font-size="17" fill="#cbd5e1">URLs, radio, queues and current-track metadata over the existing wideband SIP path</text>
<rect x="40" y="145" width="230" height="120" rx="16" fill="#075985"/><text x="60" y="180" font-size="22">Home Assistant</text><text x="60" y="211" font-size="16">Play · pause · seek</text><text x="60" y="237" font-size="16">Queue · volume · mute</text>
<rect x="40" y="320" width="230" height="120" rx="16" fill="#6b21a8"/><text x="60" y="355" font-size="22">Music Assistant</text><text x="60" y="386" font-size="16">Provider queue → HTTP</text><text x="60" y="412" font-size="16">Basic ICY → track titles</text>
<rect x="350" y="145" width="310" height="295" rx="16" fill="#115e59"/><text x="375" y="182" font-size="22">Authenticated gateway</text><text x="375" y="220" font-size="16">Exact session + line + call UID</text><text x="375" y="251" font-size="16">Checked HTTP(S) fetch</text><text x="375" y="282" font-size="16">Bounded decoder / file spool</text><text x="375" y="313" font-size="16">16 kHz PCM + digital gain</text><text x="375" y="354" font-size="16" fill="#99f6e4">No URL in the dialplan</text><text x="375" y="384" font-size="16" fill="#99f6e4">No stored microphone audio</text><text x="375" y="414" font-size="16" fill="#99f6e4">Pause sends silence</text>
<rect x="755" y="145" width="325" height="120" rx="16" fill="#9a3412"/><text x="780" y="182" font-size="22">Asterisk</text><text x="780" y="215" font-size="16">Loopback AudioSocket channel</text><text x="780" y="241" font-size="16">Wideband SIP / G.722</text>
<rect x="755" y="320" width="325" height="120" rx="16" fill="#1e40af"/><text x="780" y="357" font-size="22">Cisco 7945G</text><text x="780" y="390" font-size="16">Speaker or handset</text><text x="780" y="416" font-size="16">Both lines → one physical player</text>
<g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M270 200H340"/><path d="M270 380H340"/><path d="M660 205H745"/><path d="M915 265V310"/></g><text x="40" y="506" font-size="17" fill="#cbd5e1">Seek: verified finite files only. Pause keeps a bounded buffer. Physical speaker volume remains separate.</text></g></svg>
