<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc"><title id="title">Ten Cisco identities and Mac SIP client</title><desc id="desc">Configuration schematic for twenty independent Cisco SIP lines and Mac 209. Online status depends on the connected devices; keep identities and credentials when a phone is unplugged. A PoE switch connects Cisco 7945G handsets to Asterisk in k3s. Home Assistant offers call controls and Assist 630 with Silero Baya. Radio 701 through 710 runs only during a call. Temporary TFTP is restricted to selected phones. Group 620 rings one primary line per Cisco identity and excludes Mac 209. Actual commissioning and call acceptance are recorded separately.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#48DDCC"/></marker><marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#F7CB64"/></marker></defs><rect width="1440" height="1080" fill="#101C34"/><g font-family="Arial, sans-serif"><text x="45" y="57" font-size="38" fill="#F5F7FB" font-weight="700" text-anchor="start">Ten Cisco identities + Mac SIP client</text><text x="45" y="96" font-size="23" fill="#AAB9D0" font-weight="400" text-anchor="start">Independent SIP credentials · preserve every profile when a phone is unplugged</text><rect x="35" y="128" width="1370" height="284" rx="18" fill="none" stroke="#30465F" stroke-width="2"/><rect x="55" y="147" width="248" height="111" rx="12" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="179" y="182" font-size="18" fill="#AAB9D0" font-weight="400" text-anchor="middle">PHONE 1</text><text x="179" y="227" font-size="29" fill="#F5F7FB" font-weight="700" text-anchor="middle">201 / 202</text><rect x="325" y="147" width="248" height="111" rx="12" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="449" y="182" font-size="18" fill="#AAB9D0" font-weight="400" text-anchor="middle">PHONE 2</text><text x="449" y="227" font-size="29" fill="#F5F7FB" font-weight="700" text-anchor="middle">203 / 204</text><rect x="595" y="147" width="248" height="111" rx="12" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="719" y="182" font-size="18" fill="#AAB9D0" font-weight="400" text-anchor="middle">PHONE 3</text><text x="719" y="227" font-size="29" fill="#F5F7FB" font-weight="700" text-anchor="middle">205 / 206</text><rect x="865" y="147" width="248" height="111" rx="12" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="989" y="182" font-size="18" fill="#AAB9D0" font-weight="400" text-anchor="middle">PHONE 4</text><text x="989" y="227" font-size="29" fill="#F5F7FB" font-weight="700" text-anchor="middle">207 / 208</text><rect x="1135" y="147" width="248" height="111" rx="12" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="1259" y="182" font-size="18" fill="#AAB9D0" font-weight="400" text-anchor="middle">PHONE 5</text><text x="1259" y="227" font-size="29" fill="#F5F7FB" font-weight="700" text-anchor="middle">210 / 211</text><rect x="55" y="277" width="248" height="111" rx="12" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="179" y="312" font-size="18" fill="#AAB9D0" font-weight="400" text-anchor="middle">PHONE 6</text><text x="179" y="357" font-size="29" fill="#F5F7FB" font-weight="700" text-anchor="middle">212 / 213</text><rect x="325" y="277" width="248" height="111" rx="12" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="449" y="312" font-size="18" fill="#AAB9D0" font-weight="400" text-anchor="middle">PHONE 7</text><text x="449" y="357" font-size="29" fill="#F5F7FB" font-weight="700" text-anchor="middle">214 / 215</text><rect x="595" y="277" width="248" height="111" rx="12" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="719" y="312" font-size="18" fill="#AAB9D0" font-weight="400" text-anchor="middle">PHONE 8</text><text x="719" y="357" font-size="29" fill="#F5F7FB" font-weight="700" text-anchor="middle">216 / 217</text><rect x="865" y="277" width="248" height="111" rx="12" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="989" y="312" font-size="18" fill="#AAB9D0" font-weight="400" text-anchor="middle">PHONE 9</text><text x="989" y="357" font-size="29" fill="#F5F7FB" font-weight="700" text-anchor="middle">218 / 219</text><rect x="1135" y="277" width="248" height="111" rx="12" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="1259" y="312" font-size="18" fill="#AAB9D0" font-weight="400" text-anchor="middle">PHONE 10</text><text x="1259" y="357" font-size="29" fill="#F5F7FB" font-weight="700" text-anchor="middle">220 / 221</text><g fill="none" stroke-width="3"><path d="M680,412 V470" stroke="#48DDCC" marker-end="url(#arrow)"/><path d="M365,523 H490" stroke="#48DDCC" marker-end="url(#arrow)"/><path d="M870,523 H1030" stroke="#48DDCC" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M1200,575 V625 H315 V670" stroke="#F7CB64" marker-end="url(#gold)"/><path d="M805,625 V670" stroke="#F7CB64" marker-end="url(#gold)"/><path d="M1197,625 V670" stroke="#F7CB64" stroke-dasharray="8 6" marker-end="url(#gold)"/></g><text x="427" y="504" font-size="20" fill="#48DDCC" font-weight="400" text-anchor="middle">LAN</text><text x="950" y="501" font-size="21" fill="#48DDCC" font-weight="400" text-anchor="middle">SIP / RTP</text><rect x="45" y="470" width="320" height="105" rx="12" fill="#172841" stroke="#B3A0FF" stroke-width="2"/><text x="205" y="511" font-size="29" fill="#F5F7FB" font-weight="700" text-anchor="middle">Mac SIP client</text><text x="205" y="553" font-size="25" fill="#B3A0FF" font-weight="400" text-anchor="middle">209 · TCP</text><rect x="490" y="470" width="380" height="105" rx="12" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="680" y="511" font-size="31" fill="#F5F7FB" font-weight="700" text-anchor="middle">PoE switch</text><text x="680" y="552" font-size="22" fill="#48DDCC" font-weight="400" text-anchor="middle">Power + LAN for Cisco phones</text><rect x="1030" y="470" width="340" height="105" rx="12" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="1200" y="511" font-size="30" fill="#F5F7FB" font-weight="700" text-anchor="middle">Asterisk · PJSIP</text><text x="1200" y="551" font-size="23" fill="#48DDCC" font-weight="400" text-anchor="middle">k3s · one replica</text><rect x="45" y="670" width="540" height="174" rx="12" fill="#172841" stroke="#F7CB64" stroke-width="2"/><text x="315" y="713" font-size="30" fill="#F5F7FB" font-weight="700" text-anchor="middle">Home Assistant</text><text x="315" y="753" font-size="23" fill="#F7CB64" font-weight="400" text-anchor="middle">Calls · timers · alarms · DND</text><text x="315" y="790" font-size="24" fill="#F5F7FB" font-weight="700" text-anchor="middle">Assist 630 · Russian Silero Baya</text><text x="315" y="822" font-size="21" fill="#AAB9D0" font-weight="400" text-anchor="middle">Text and image notifications</text><rect x="625" y="670" width="360" height="174" rx="12" fill="#172841" stroke="#F7CB64" stroke-width="2"/><text x="805" y="722" font-size="29" fill="#F5F7FB" font-weight="700" text-anchor="middle">Radio 701–710</text><text x="805" y="767" font-size="22" fill="#F7CB64" font-weight="400" text-anchor="middle">Fetch only during a call</text><text x="805" y="808" font-size="21" fill="#AAB9D0" font-weight="400" text-anchor="middle">Music + children’s stations</text><rect x="1025" y="670" width="345" height="174" rx="12" fill="#172841" stroke="#FF836D" stroke-width="2"/><text x="1197" y="722" font-size="27" fill="#F5F7FB" font-weight="700" text-anchor="middle">Temporary TFTP</text><text x="1197" y="767" font-size="22" fill="#FF836D" font-weight="400" text-anchor="middle">Selected phones only</text><text x="1197" y="808" font-size="20" fill="#AAB9D0" font-weight="400" text-anchor="middle">Bounded provisioning window</text><rect x="45" y="893" width="1325" height="116" rx="12" fill="#172841" stroke="#F7CB64" stroke-width="2"/><text x="70" y="932" font-size="29" fill="#F5F7FB" font-weight="700" text-anchor="start">Group 620 · one primary line per Cisco identity</text><text x="70" y="978" font-size="26" fill="#F7CB64" font-weight="400" text-anchor="start">201 + 203 + 205 + 207 + 210 + 212 + 214 + 216 + 218 + 220</text><text x="1338" y="978" font-size="20" fill="#AAB9D0" font-weight="400" text-anchor="end">Mac 209 excluded</text><text x="45" y="1044" font-size="22" fill="#AAB9D0" font-weight="400" text-anchor="start">Online status follows the connected devices. Never reuse an existing identity for replacement hardware.</text></g></svg>
