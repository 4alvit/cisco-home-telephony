<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" role="img" aria-label="SIP devices, DECT bases and host audio clients connect to Asterisk. Home Assistant controls calls. The stock Google display receives media output separately.">
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L7 4L0 8" fill="none" stroke="#647e9a" stroke-width="1.5"></path></marker></defs>
<rect width="1080" height="460" fill="#f4f8fc"></rect><g stroke="#647e9a" stroke-width="2" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"><path d="M340 90H409V220H445"></path><path d="M340 220H445"></path><path d="M340 350H409V250H445"></path><path d="M650 230H730"></path></g><path d="M870 288V344" fill="none" stroke="#647e9a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"></path>
<g font-family="system-ui,sans-serif" fill="#17283e"><g fill="#e2f3ec" stroke="#a9d5c4"><rect x="28" y="45" width="312" height="90" rx="12"></rect><rect x="28" y="175" width="312" height="90" rx="12"></rect><rect x="28" y="305" width="312" height="90" rx="12"></rect></g><g font-size="18" font-weight="700"><text x="47" y="78">Native SIP / Wi-Fi</text><text x="47" y="208">DECT / analog telephone</text><text x="47" y="338">USB audio / browser display</text></g><g font-size="14"><text x="47" y="106">TECHO5 · Android · WP8xx handset</text><text x="47" y="237">Compatible IP base or FXS adapter</text><text x="47" y="367">Host runs SIP app or WebRTC client</text></g>
<rect x="445" y="173" width="205" height="115" rx="16" fill="#173d66"></rect><text x="548" y="218" text-anchor="middle" font-size="27" fill="white" font-weight="700">Asterisk</text><text x="548" y="249" text-anchor="middle" font-size="15" fill="#d2e7ff">Numbers · calls · routing</text><text x="548" y="274" text-anchor="middle" font-size="13" fill="#d2e7ff">Existing phones + new endpoints</text>
<rect x="730" y="173" width="290" height="115" rx="16" fill="#e4eefb" stroke="#b8cde9"></rect><text x="875" y="214" text-anchor="middle" font-size="23" font-weight="700">Home Assistant</text><text x="875" y="246" text-anchor="middle" font-size="15">Call state and supported controls</text><text x="875" y="269" text-anchor="middle" font-size="13">Per-device capabilities still matter</text>
<rect x="730" y="348" width="290" height="74" rx="12" fill="#fff1d2" stroke="#d9be7d"></rect><text x="875" y="378" text-anchor="middle" font-size="17" font-weight="700">Stock Google / Lenovo display</text><text x="875" y="403" text-anchor="middle" font-size="14">Cast output is not a SIP mic uplink</text><text x="885" y="325" font-size="12">one-way media</text><text x="28" y="438" font-size="13" fill="#52657b">Example architecture. Supported controls depend on the selected endpoint and its adapter.</text></g></svg>