<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Three Cisco phones, six independent lines</title>
  <desc id="desc">Architectural example, not a completed deployment claim. Phone A has lines 201 and 202, phone B 203 and 204, and phone C 205 and 206. All connect through a PoE switch to Asterisk on k3s. Home Assistant provides AMI control and Assist on 630. Temporary TFTP serves selected phones for at most one hour. Group 620 rings only primary lines 201, 203 and 205.</desc>
  <defs>
    <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#48DDCC"/></marker>
    <marker id="coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#FF836D"/></marker>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#F7CB64"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#101C34"/>
  <g font-family="Arial, sans-serif">
    <text x="45" y="55" font-size="34" font-weight="700" fill="#F5F7FB">Three phones, six independent lines</text>
    <text x="45" y="92" font-size="21" fill="#AAB9D0">Architectural example · accept each device before marking the rollout complete</text>

    <g fill="none" stroke-width="3">
      <path d="M285,230 H320 V360 H365" stroke="#48DDCC" marker-end="url(#teal)"/>
      <path d="M285,400 H365" stroke="#48DDCC" marker-end="url(#teal)"/>
      <path d="M285,570 H320 V440 H365" stroke="#48DDCC" marker-end="url(#teal)"/>
      <path d="M555,400 H690" stroke="#48DDCC" marker-start="url(#teal)" marker-end="url(#teal)"/>
      <path d="M925,400 H1005" stroke="#F7CB64" marker-start="url(#gold)" marker-end="url(#gold)"/>
      <path d="M460,255 V330" stroke="#FF836D" stroke-dasharray="8 6" marker-end="url(#coral)"/>
      <path d="M807,470 V530" stroke="#F7CB64" marker-end="url(#gold)"/>
    </g>
    <text x="622" y="373" text-anchor="middle" font-size="21" fill="#48DDCC">SIP / RTP</text>

    <g fill="#172841" stroke="#48DDCC" stroke-width="2">
      <rect x="45" y="180" width="240" height="100" rx="10"/>
      <rect x="45" y="350" width="240" height="100" rx="10"/>
      <rect x="45" y="520" width="240" height="100" rx="10"/>
      <rect x="365" y="330" width="190" height="140" rx="10"/>
      <rect x="690" y="330" width="235" height="140" rx="10"/>
    </g>
    <g text-anchor="middle" fill="#F5F7FB">
      <text x="165" y="218" font-size="24" font-weight="600">Phone A · 7945G</text>
      <text x="165" y="256" font-size="30" font-weight="700">201 / 202</text>
      <text x="165" y="388" font-size="24" font-weight="600">Phone B · 7945G</text>
      <text x="165" y="426" font-size="30" font-weight="700">203 / 204</text>
      <text x="165" y="558" font-size="24" font-weight="600">Phone C · 7945G</text>
      <text x="165" y="596" font-size="30" font-weight="700">205 / 206</text>
      <text x="460" y="388" font-size="26" font-weight="600">PoE switch</text>
      <text x="460" y="426" font-size="21">Power + LAN</text>
      <text x="807" y="387" font-size="29" font-weight="600">Asterisk</text>
      <text x="807" y="427" font-size="23">PJSIP · k3s</text>
    </g>

    <rect x="365" y="145" width="335" height="110" rx="10" fill="#172841" stroke="#FF836D" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="532" y="181" font-size="26" font-weight="600" fill="#F5F7FB">Temporary TFTP</text>
      <text x="532" y="213" font-size="20" fill="#F5F7FB">Profiles + signed firmware</text>
      <text x="532" y="240" font-size="19" fill="#FF836D">≤ 1 hour · selected phones only</text>
    </g>

    <rect x="1005" y="310" width="230" height="180" rx="10" fill="#172841" stroke="#F7CB64" stroke-width="2"/>
    <g text-anchor="middle" fill="#F5F7FB">
      <text x="1120" y="355" font-size="25" font-weight="600">Home Assistant</text>
      <text x="1120" y="398" font-size="22">AMI control</text>
      <text x="1120" y="443" font-size="29" font-weight="700">Assist 630</text>
      <text x="1120" y="471" font-size="19" fill="#F7CB64">VoIP · SIP / RTP</text>
    </g>

    <rect x="715" y="530" width="520" height="95" rx="10" fill="#172841" stroke="#F7CB64" stroke-width="2"/>
    <text x="740" y="570" font-size="25" font-weight="600" fill="#F5F7FB">Group 620 → 201 + 203 + 205</text>
    <text x="740" y="605" font-size="21" fill="#F7CB64">First line only · one call leg per physical phone</text>

    <text x="45" y="674" font-size="21" fill="#AAB9D0">Separate SIP credentials per line. Enable Assist for each chosen caller identity.</text>
    <text x="45" y="702" font-size="19" fill="#AAB9D0">Close the TFTP Job and temporary firewall access after provisioning finishes.</text>
  </g>
</svg>
