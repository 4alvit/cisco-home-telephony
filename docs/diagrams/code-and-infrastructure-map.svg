<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1680" viewBox="0 0 1600 1680" role="img" aria-labelledby="title desc">
<title id="title">Cisco telephony code and infrastructure map</title>
<desc id="desc">Four lanes separate private provisioning, operator control, ordinary SIP calls and manual voice with direct handset RTP and Home Assistant WebSocket audio. Lower panels distinguish durable from ephemeral state and test evidence from unverified physical behavior.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b43}.title{font-size:38px;font-weight:700}.subtitle{font-size:21px;fill:#52657a}.lane{font-size:23px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#52657a}.edge{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}.mono{font-family:Menlo,Consolas,monospace;font-size:17px}.note{font-size:18px;fill:#52657a}</style>
<rect width="1600" height="1680" fill="#f4f7fb"/>

<text x="38" y="58" class="title">Code &amp; infrastructure map</text>
<text x="40" y="96" class="subtitle">Follow the execution path, then check who owns its state and what the evidence proves.</text>
<rect x="22" y="125" width="1556" height="218" rx="18" fill="#fff" stroke="#dae3ef"/>
<rect x="22" y="125" width="8" height="218" rx="4" fill="#2b6fb0" stroke="#2b6fb0"/>
<text x="43" y="158" class="lane" style="fill:#2b6fb0">1  PROVISIONING — one private input set configures both sides</text>
<rect x="44" y="184" width="305" height="122" rx="14" fill="#eaf3ff" stroke="#9cbce2"/>
<text x="62" y="215" class="head">Private site + inventory</text>
<text x="62" y="244" class="body">Phones, lines, credentials</text>
<text x="62" y="270" class="body">Licensed firmware stays separate</text>
<rect x="407" y="184" width="330" height="122" rx="14" fill="#eaf3ff" stroke="#9cbce2"/>
<text x="425" y="215" class="head">Generators</text>
<text x="425" y="244" class="body">provision.py → phone XML / PBX</text>
<text x="425" y="270" class="body">configure_gateway.py → API config</text>
<rect x="795" y="184" width="335" height="122" rx="14" fill="#eaf3ff" stroke="#9cbce2"/>
<text x="813" y="215" class="head">Renderers</text>
<text x="813" y="244" class="body">render_k3s.py / render_gateway.py</text>
<text x="813" y="270" class="body">Immutable Secrets + Deployments</text>
<rect x="1188" y="184" width="365" height="122" rx="14" fill="#eaf3ff" stroke="#9cbce2"/>
<text x="1206" y="215" class="head">Deployment boundary</text>
<text x="1206" y="244" class="body">Pinned node • host networking</text>
<text x="1206" y="270" class="body">TFTP: optional one-hour Job</text>
<path d="M349 247 H402" class="edge"/>
<path d="M737 247 H790" class="edge"/>
<path d="M1130 247 H1183" class="edge"/>
<text x="44" y="327" class="note">Existing network owners retain DHCP, DNS, NTP, routing and host firewall rules. Rendering alone deploys nothing.</text>
<rect x="22" y="365" width="1556" height="245" rx="18" fill="#fff" stroke="#dae3ef"/>
<rect x="22" y="365" width="8" height="245" rx="4" fill="#7656b4" stroke="#7656b4"/>
<text x="43" y="398" class="lane" style="fill:#7656b4">2  OPERATOR CONTROL — requests are not audio</text>
<rect x="44" y="451" width="264" height="110" rx="14" fill="#edf3ff" stroke="#adc4e3"/>
<text x="62" y="482" class="head">CLI / Cisco controls</text>
<text x="62" y="511" class="body">cisco.py / HTTP integration</text>
<text x="62" y="537" class="body">Explicit authenticated request</text>
<rect x="356" y="439" width="340" height="134" rx="14" fill="#f1ebff" stroke="#c1afe4"/>
<text x="374" y="470" class="head">HTTP gateway</text>
<text x="374" y="499" class="body">Handler → Gateway</text>
<text x="374" y="525" class="body">Source ACL + bearer token</text>
<text x="374" y="551" class="body">Fresh state and action policy</text>
<rect x="770" y="419" width="323" height="76" rx="14" fill="#e6f5ed" stroke="#8dbfa5"/>
<text x="788" y="450" class="head">AMI control + observation</text>
<text x="788" y="479" class="body">AMI.action() / snapshot()</text>
<rect x="770" y="506" width="323" height="70" rx="14" fill="#fff0ed" stroke="#e5b0a4"/>
<text x="788" y="537" class="head">Phone XML execution</text>
<text x="788" y="566" class="body">execute() + auth callback</text>
<rect x="1190" y="419" width="360" height="76" rx="14" fill="#e6f5ed" stroke="#8dbfa5"/>
<text x="1208" y="450" class="head">Asterisk</text>
<text x="1208" y="479" class="body">Calls, channels, alerts, DND</text>
<rect x="1190" y="506" width="360" height="70" rx="14" fill="#fff0ed" stroke="#e5b0a4"/>
<text x="1208" y="537" class="head">Cisco handset</text>
<text x="1208" y="566" class="body">Keys, display, dial, media commands</text>
<path d="M308 507 H350" class="edge"/>
<path d="M696 482 H724 V457 H764" class="edge"/>
<path d="M696 535 H724 V541 H764" class="edge"/>
<path d="M1093 457 H1184" class="edge"/>
<path d="M1093 541 H1184" class="edge"/>
<text x="44" y="593" class="note">GET can reconcile pending cleanup. Upstream HA Asterisk uses direct AMI, outside this gateway policy.</text>
<rect x="22" y="630" width="1556" height="162" rx="18" fill="#fff" stroke="#dae3ef"/>
<rect x="22" y="630" width="8" height="162" rx="4" fill="#278567" stroke="#278567"/>
<text x="43" y="663" class="lane" style="fill:#278567">3  ORDINARY CALLS — SIP signaling and call RTP</text>
<rect x="73" y="688" width="330" height="79" rx="14" fill="#fff0ed" stroke="#e5b0a4"/>
<text x="91" y="719" class="head">Cisco / softphone</text>
<text x="91" y="748" class="body">Registered call endpoints</text>
<rect x="630" y="688" width="340" height="79" rx="14" fill="#e6f5ed" stroke="#8dbfa5"/>
<text x="648" y="719" class="head">Asterisk</text>
<text x="648" y="748" class="body">PJSIP • direct_media=no</text>
<rect x="1200" y="688" width="350" height="79" rx="14" fill="#e5f7fa" stroke="#92c5cd"/>
<text x="1218" y="719" class="head">HA VoIP listener</text>
<text x="1218" y="748" class="body">Optional SIP Assist route</text>
<path d="M411 729 H621" class="edge both"/>
<text x="457" y="717" class="small">SIP + RTP</text>
<path d="M978 729 H1190" class="edge both"/>
<text x="1023" y="717" class="small">SIP + RTP</text>
<rect x="22" y="812" width="1556" height="336" rx="18" fill="#fff" stroke="#dae3ef"/>
<rect x="22" y="812" width="8" height="336" rx="4" fill="#be6c21" stroke="#be6c21"/>
<text x="43" y="845" class="lane" style="fill:#be6c21">4  MANUAL VOICE — direct handset media, separate HA pipeline</text>
<rect x="44" y="889" width="280" height="160" rx="14" fill="#f1ebff" stroke="#c1afe4"/>
<text x="62" y="920" class="head">Gateway voice registry</text>
<text x="62" y="949" class="body">VoiceControl.start()</text>
<text x="62" y="975" class="body">One physical-phone owner</text>
<text x="62" y="1001" class="body">Lock + durable journal</text>
<text x="62" y="1027" class="body">Explicit bounded worker</text>
<rect x="381" y="870" width="599" height="234" rx="14" fill="#fff5dd" stroke="#dbbd76"/>
<text x="399" y="901" class="head">Worker: voice_session.py</text>
<text x="399" y="930" class="body">VoiceSession + PhoneVoiceController</text>
<text x="399" y="956" class="body">8 kHz G.711 / PCM ↔ 16 kHz assistant PCM</text>
<text x="399" y="982" class="body">AssistantService → HAClient → WavePlayback</text>
<text x="399" y="1008" class="body">AMI observes both lines for call preemption</text>
<text x="399" y="1034" class="body">Stop / error invalidates queued output</text>
<text x="399" y="1060" class="body">Fetch + decode reply before paced playback</text>
<rect x="1140" y="878" width="410" height="103" rx="14" fill="#fff0ed" stroke="#e5b0a4"/>
<text x="1158" y="909" class="head">Cisco handset</text>
<text x="1158" y="938" class="body">RTPTx / RTPRx started by XML</text>
<text x="1158" y="964" class="body">Direct UDP/RTP with worker</text>
<rect x="1140" y="1021" width="410" height="103" rx="14" fill="#e5f7fa" stroke="#92c5cd"/>
<text x="1158" y="1052" class="head">HA Assist + providers</text>
<text x="1158" y="1081" class="body">Explicit selected pipeline</text>
<text x="1158" y="1107" class="body">STT → conversation → TTS URL</text>
<path d="M324 964 H375" class="edge"/>
<path d="M988 923 H1131" class="edge both"/>
<text x="1007" y="911" class="small">RTP audio</text>
<path d="M988 1074 H1131" class="edge both"/>
<text x="1000" y="1061" class="small">WS + HTTP</text>
<text x="44" y="1130" class="note">No microphone audio passes through Asterisk on this path. Start is deliberate; Stop, failure and expiry do not rearm it.</text>
<rect x="22" y="1168" width="1556" height="240" rx="18" fill="#fff" stroke="#dae3ef"/>
<rect x="22" y="1168" width="8" height="240" rx="4" fill="#8d6424" stroke="#8d6424"/>
<text x="43" y="1201" class="lane" style="fill:#8d6424">STATE &amp; RECOVERY — preserve the owner, not just the container</text>
<rect x="44" y="1228" width="484" height="152" rx="14" fill="#fff5dd" stroke="#dbbd76"/>
<text x="62" y="1259" class="head">Persistent ownership</text>
<text x="62" y="1288" class="body">Gateway SQLite: preferences + operation IDs</text>
<text x="62" y="1314" class="body">Voice: locks, leases and cleanup journals</text>
<text x="62" y="1340" class="body">HA: entries, schedules, provider selection</text>
<text x="62" y="1366" class="body">Unconfirmed Stop → recovery_required</text>
<rect x="558" y="1228" width="484" height="152" rx="14" fill="#f1f5fb" stroke="#bac9dd"/>
<text x="576" y="1259" class="head">Ephemeral runtime</text>
<text x="576" y="1288" class="body">PBX database / spool / log: emptyDir</text>
<text x="576" y="1314" class="body">Voice staged config + scratch: temporary</text>
<text x="576" y="1340" class="body">Code lives in the immutable image</text>
<text x="576" y="1366" class="body">Back up durable state consistently</text>
<rect x="1072" y="1228" width="478" height="152" rx="14" fill="#f8edff" stroke="#cfb1df"/>
<text x="1090" y="1259" class="head">Replacement and rollback</text>
<text x="1090" y="1288" class="body">One gateway; preserve its host-path state</text>
<text x="1090" y="1314" class="body">Keep prior image + Secrets + Deployment</text>
<text x="1090" y="1340" class="body">Recreate rollout; no automatic rollback</text>
<text x="1090" y="1366" class="body">Never clear journals to force a new start</text>
<rect x="22" y="1428" width="1556" height="198" rx="18" fill="#fff" stroke="#dae3ef"/>
<rect x="22" y="1428" width="8" height="198" rx="4" fill="#33758a" stroke="#33758a"/>
<text x="43" y="1461" class="lane" style="fill:#33758a">EVIDENCE — a passed software check has a defined boundary</text>
<rect x="44" y="1484" width="484" height="115" rx="14" fill="#e8f3fa" stroke="#a1bed1"/>
<text x="62" y="1515" class="head">Code and local fixtures</text>
<text x="62" y="1544" class="body">Auth • contracts • cancel • timeout • cleanup</text>
<text x="62" y="1570" class="body">Synthetic audio and injected dependencies</text>
<text x="62" y="1596" class="body">Source/test links are in the maintainer guide</text>
<rect x="558" y="1484" width="484" height="115" rx="14" fill="#e8f3fa" stroke="#a1bed1"/>
<text x="576" y="1515" class="head">Images and saved provider runs</text>
<text x="576" y="1544" class="body">Isolated image smoke and synthetic replay</text>
<text x="576" y="1570" class="body">Prove only their recorded inputs and scope</text>
<text x="576" y="1596" class="body">VAD-bypass candidate rejected</text>
<rect x="1072" y="1484" width="478" height="115" rx="14" fill="#fff0ed" stroke="#e5b0a4"/>
<text x="1090" y="1515" class="head">Physical acceptance remains separate</text>
<text x="1090" y="1544" class="body">Real handset audio, call races and mic closure</text>
<text x="1090" y="1570" class="body">Room acoustics and perceived response time</text>
<text x="1090" y="1596" class="body">No full acoustic end-to-end acceptance claim</text>
<text x="40" y="1657" class="note">Offline source map • generic topology • no live infrastructure inspection or configuration change</text>
</svg>
