<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Handset hotline: one answer connects the call</title>
<desc id="desc">The dedicated entry phone calls Asterisk group 622. Eligible phones ring together, the first answer connects, and the other legs stop. The excluded phone never rings.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#94a3b8"/></marker></defs>
<rect width="960" height="390" rx="22" fill="#0f172a"/>
<g font-family="system-ui, sans-serif"><text x="36" y="45" font-size="25" font-weight="700" fill="#f8fafc">Lift. Ring. Connect.</text><text x="36" y="73" font-size="15" fill="#cbd5e1">One dedicated handset · one private conversation · no paging</text>
<rect x="35" y="135" width="210" height="110" rx="16" fill="#164e63" stroke="#22d3ee"/><text x="59" y="169" font-size="19" font-weight="600" fill="white">Entry phone</text><text x="59" y="197" font-size="15" fill="#cffafe">Handset or Speaker</text><text x="59" y="224" font-size="14" fill="#cffafe">Dedicated dial template</text>
<path d="M245 190H325" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="335" y="130" width="230" height="120" rx="16" fill="#312e81" stroke="#a5b4fc"/><text x="360" y="166" font-size="19" font-weight="600" fill="white">Asterisk · 622</text><text x="360" y="193" font-size="15" fill="#e0e7ff">Authenticated source only</text><text x="360" y="220" font-size="15" fill="#e0e7ff">Parallel ringing + DND</text>
<path d="M565 175H625V133H665M625 175V226H665" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="675" y="98" width="250" height="78" rx="14" fill="#14532d" stroke="#4ade80"/><text x="695" y="128" font-size="17" font-weight="600" fill="white">First person answers</text><text x="695" y="153" font-size="14" fill="#dcfce7">Normal two-way conversation</text>
<rect x="675" y="190" width="250" height="78" rx="14" fill="#78350f" stroke="#fbbf24"/><text x="695" y="221" font-size="17" font-weight="600" fill="white">Other ringing legs stop</text><text x="695" y="246" font-size="14" fill="#fef3c7">No conference or automatic reply</text>
<rect x="35" y="297" width="890" height="58" rx="13" fill="#1e293b"/><text x="56" y="332" font-size="16" fill="#cbd5e1">Excluded phone: no call leg  ·  No answer: bounded timeout  ·  Hang up: cancel</text></g></svg>
