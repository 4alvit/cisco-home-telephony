<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Automatic spoken notifications on Cisco phones and converted Echo speakers</title>
  <desc id="desc">An explicitly selected Home Assistant text notification reaches the existing gateway. Private routes, durable duplicate prevention, freshness checks and device idle checks guard delivery. Cisco receives a one-shot speakerphone announcement through Asterisk; Echo receives direct audio with the same configured HA voice. Cisco screen-only delivery is an optional alternative, not speech. Busy or offline devices are skipped without replay.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1630"/><stop offset="1" stop-color="#162747"/></linearGradient>
    <linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#078ea2"/><stop offset="1" stop-color="#165e99"/></linearGradient>
    <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#6744b7"/><stop offset="1" stop-color="#513b99"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#83a4c9"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#edf5ff}
      .title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#b8cce5}
      .heading{font-size:21px;font-weight:700}.body{font-size:16px;fill:#d2e2f3}
      .small{font-size:14px;fill:#c3d5ed}.badge{font-size:13px;font-weight:700;letter-spacing:1px}
      .line{fill:none;stroke:#83a4c9;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="850" rx="24" fill="url(#bg)"/>
  <text x="48" y="61" class="title">Text notifications. Spoken with your HA voice.</text>
  <text x="48" y="93" class="subtitle">Cisco phones and converted Echo speakers · selected sources · private device routes</text>

  <rect x="48" y="132" width="340" height="148" rx="18" fill="url(#cyan)"/>
  <text x="70" y="166" class="badge">01 / ORIGINAL DELIVERY</text>
  <text x="70" y="201" class="heading">Home Assistant notification</text>
  <text x="70" y="233" class="body">Keep mobile, browser and TV routes.</text>
  <text x="70" y="258" class="body">Device copies cannot block originals.</text>

  <path d="M 388 207 H 438" class="line"/>
  <rect x="449" y="132" width="703" height="148" rx="18" fill="#203755" stroke="#375678"/>
  <text x="473" y="166" class="badge">02 / OPT-IN COPY</text>
  <text x="473" y="201" class="heading">also_devices → separate event consumer</text>
  <text x="473" y="233" class="body">Original event ID + time + source category + title + message</text>
  <text x="473" y="258" class="body">Explicit speech_enabled · chosen recipients · no retry loop</text>

  <path d="M 801 280 V 317" class="line"/>
  <rect x="48" y="331" width="1104" height="142" rx="18" fill="#163c3d" stroke="#277c72"/>
  <text x="72" y="365" class="badge">03 / EXISTING GATEWAY · POST /v1/notifications</text>
  <text x="72" y="405" class="heading">Private routing + durable claims before delivery</text>
  <text x="72" y="437" class="body">Allowed sources · physical-device deduplication · event expiry · cooldown · quiet hours · busy / DND checks</text>
  <rect x="866" y="355" width="261" height="37" rx="18" fill="#245b51"/>
  <text x="886" y="379" class="small">No message text in delivery history</text>

  <path d="M 219 473 V 516" class="line"/>
  <path d="M 600 473 V 516" class="line"/>
  <path d="M 981 473 V 516" class="line"/>

  <rect x="48" y="530" width="342" height="210" rx="18" fill="url(#cyan)"/>
  <text x="70" y="563" class="badge">04A / CISCO SPEECH</text>
  <text x="70" y="597" class="heading">One announcement call</text>
  <text x="70" y="629" class="body">HA voice → Asterisk → phone</text>
  <text x="70" y="654" class="body">Verify owned call → speakerphone</text>
  <text x="70" y="679" class="body">Play once → automatic hangup</text>
  <text x="70" y="716" class="small">No persistent auto-answer change.</text>

  <rect x="429" y="530" width="342" height="210" rx="18" fill="url(#violet)"/>
  <text x="451" y="563" class="badge">04B / CONVERTED ECHO</text>
  <text x="451" y="597" class="heading">Direct announcement</text>
  <text x="451" y="629" class="body">Configured HA voice → adapter</text>
  <text x="451" y="654" class="body">Atomic idle guard → speaker</text>
  <text x="451" y="679" class="body">Correlated, bounded playback</text>
  <text x="451" y="716" class="small">No SIP call or fallback route.</text>

  <rect x="810" y="530" width="342" height="210" rx="18" fill="#263b51" stroke="#486780"/>
  <text x="832" y="563" class="badge">04C / OPTIONAL SCREEN ONLY</text>
  <text x="832" y="597" class="heading">Idle Cisco text page</text>
  <text x="832" y="629" class="body">An alternative to spoken delivery</text>
  <text x="832" y="654" class="body">One page per physical handset</text>
  <text x="832" y="679" class="body">Automatic page idle timeout</text>
  <text x="832" y="716" class="small">A phone uses one delivery mode.</text>

  <rect x="48" y="770" width="1104" height="50" rx="12" fill="#0c1930"/>
  <text x="70" y="800" class="small">Existing calls are never interrupted. Offline or uncertain delivery is not replayed. Acceptance is not proof of audible output.</text>
</svg>
