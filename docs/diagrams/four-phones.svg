<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Four Cisco phones, eight independent lines</title>
  <desc id="desc">Architectural example, not a completed deployment claim. Phone A has lines 201 and 202, phone B 203 and 204, phone C 205 and 206, and phone D 207 and 208. All connect through a PoE switch to Asterisk on k3s. Home Assistant provides AMI control and Assist on 630. Temporary TFTP serves only selected phones. Group 620 rings the first line on each device: 201, 203, 205 and 207.</desc>
  <defs>
    <marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#48DDCC"/></marker>
    <marker id="coral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#FF836D"/></marker>
    <marker id="gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#F7CB64"/></marker>
  </defs>
  <rect width="1280" height="760" fill="#101C34"/>
  <g font-family="Arial, sans-serif">
    <text x="45" y="55" font-size="34" font-weight="700" fill="#F5F7FB">Four phones, eight independent lines</text>
    <text x="45" y="92" font-size="21" fill="#AAB9D0">Architectural example · accept each device before marking the rollout complete</text>

    <g fill="none" stroke-width="3">
      <path d="M285,200 H320 V365 H365" stroke="#48DDCC" marker-end="url(#teal)"/>
      <path d="M285,340 H320" stroke="#48DDCC"/>
      <path d="M285,480 H320 V445 H365" stroke="#48DDCC" marker-end="url(#teal)"/>
      <path d="M285,620 H320 V480" stroke="#48DDCC"/>
      <path d="M555,405 H690" stroke="#48DDCC" marker-start="url(#teal)" marker-end="url(#teal)"/>
      <path d="M925,405 H1005" stroke="#F7CB64" marker-start="url(#gold)" marker-end="url(#gold)"/>
      <path d="M460,270 V335" stroke="#FF836D" stroke-dasharray="8 6" marker-end="url(#coral)"/>
      <path d="M807,475 V555" stroke="#F7CB64" marker-end="url(#gold)"/>
    </g>
    <text x="622" y="378" text-anchor="middle" font-size="21" fill="#48DDCC">SIP / RTP</text>

    <g fill="#172841" stroke="#48DDCC" stroke-width="2">
      <rect x="45" y="150" width="240" height="100" rx="10"/>
      <rect x="45" y="290" width="240" height="100" rx="10"/>
      <rect x="45" y="430" width="240" height="100" rx="10"/>
      <rect x="45" y="570" width="240" height="100" rx="10"/>
      <rect x="365" y="335" width="190" height="140" rx="10"/>
      <rect x="690" y="335" width="235" height="140" rx="10"/>
    </g>
    <g text-anchor="middle" fill="#F5F7FB">
      <text x="165" y="188" font-size="24" font-weight="600">Phone A · 7945G</text>
      <text x="165" y="226" font-size="30" font-weight="700">201 / 202</text>
      <text x="165" y="328" font-size="24" font-weight="600">Phone B · 7945G</text>
      <text x="165" y="366" font-size="30" font-weight="700">203 / 204</text>
      <text x="165" y="468" font-size="24" font-weight="600">Phone C · 7945G</text>
      <text x="165" y="506" font-size="30" font-weight="700">205 / 206</text>
      <text x="165" y="608" font-size="24" font-weight="600">Phone D · 7945G</text>
      <text x="165" y="646" font-size="30" font-weight="700">207 / 208</text>
      <text x="460" y="393" font-size="26" font-weight="600">PoE switch</text>
      <text x="460" y="431" font-size="21">Power + LAN</text>
      <text x="807" y="392" font-size="29" font-weight="600">Asterisk</text>
      <text x="807" y="432" font-size="23">PJSIP · k3s</text>
    </g>

    <rect x="365" y="150" width="335" height="120" rx="10" fill="#172841" stroke="#FF836D" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="532" y="187" font-size="26" font-weight="600" fill="#F5F7FB">Temporary TFTP</text>
      <text x="532" y="220" font-size="20" fill="#F5F7FB">Profiles + signed firmware</text>
      <text x="532" y="253" font-size="19" fill="#FF836D">Bounded window · selected phones</text>
    </g>

    <rect x="1005" y="315" width="230" height="180" rx="10" fill="#172841" stroke="#F7CB64" stroke-width="2"/>
    <g text-anchor="middle" fill="#F5F7FB">
      <text x="1120" y="360" font-size="25" font-weight="600">Home Assistant</text>
      <text x="1120" y="403" font-size="22">AMI control</text>
      <text x="1120" y="448" font-size="29" font-weight="700">Assist 630</text>
      <text x="1120" y="476" font-size="19" fill="#F7CB64">VoIP · SIP / RTP</text>
    </g>

    <rect x="705" y="555" width="530" height="105" rx="10" fill="#172841" stroke="#F7CB64" stroke-width="2"/>
    <text x="730" y="595" font-size="25" font-weight="600" fill="#F5F7FB">Group 620 → 201 + 203 + 205 + 207</text>
    <text x="730" y="632" font-size="20" fill="#F7CB64">First line only · one call leg per physical phone</text>

    <text x="45" y="712" font-size="21" fill="#AAB9D0">Separate SIP credentials per line. Enable Assist for each chosen caller identity.</text>
    <text x="45" y="743" font-size="19" fill="#AAB9D0">Close the TFTP Job and temporary firewall access after provisioning finishes.</text>
  </g>
</svg>
