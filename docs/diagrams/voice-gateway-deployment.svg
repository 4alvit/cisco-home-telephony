<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">One gateway, a verified voice image, and persistent state</title>
  <desc id="desc">Offline rendering combines a verified image reference, full private gateway configuration, and a reviewed deployment and capacity snapshot. During an explicit rollout, a non-root init container stages regular owner-only files. The existing single gateway runs from image-owned source, preserves persistent state, and starts with voice disabled. Example network addresses are documentation-only.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#64748b" stroke-width="1.6"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #18314b; }
      .title { font-size: 31px; font-weight: 750; }
      .heading { font-size: 21px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 15px; }
      .label { font-size: 13px; font-weight: 750; letter-spacing: 1.8px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 15px; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="900" rx="24" fill="#f4f7fb"/>
  <text x="48" y="55" class="label" fill="#536a85">REPRODUCIBLE DEPLOYMENT</text>
  <text x="48" y="97" class="title">Upgrade the existing gateway. Keep its state.</text>
  <text x="48" y="129" class="body">Render and review offline → explicit rollout → separately attended voice acceptance</text>

  <rect x="48" y="163" width="354" height="144" rx="16" fill="#e4edff" stroke="#9dbcf5"/>
  <text x="68" y="196" class="heading">Verified runtime image</text>
  <text x="68" y="226" class="mono">repository@sha256:manifest</text>
  <text x="68" y="255" class="body">Source commit · architecture · smoke</text>
  <text x="68" y="283" class="small">Recorded runtime resolution evidence</text>

  <rect x="422" y="163" width="436" height="144" rx="16" fill="#f0e9ff" stroke="#bfa4eb"/>
  <text x="442" y="196" class="heading">Private, complete configuration</text>
  <text x="442" y="226" class="body">Gateway inventory, credentials and features</text>
  <text x="442" y="255" class="body">Optional manual voice profiles + HA token</text>
  <text x="442" y="283" class="small">Keep inputs and rendered Secrets in .local</text>

  <rect x="878" y="163" width="354" height="144" rx="16" fill="#def5ee" stroke="#8bcbb7"/>
  <text x="898" y="196" class="heading">Reviewed deployment</text>
  <text x="898" y="226" class="body">Same identity, selector and state</text>
  <text x="898" y="255" class="body">Pinned node + current capacity</text>
  <text x="898" y="283" class="small">Requests must fit; latency is measured</text>

  <path d="M225 307 V331 H640 V346" class="line"/>
  <path d="M640 307 V346" class="line"/>
  <path d="M1055 307 V331 H640" fill="none" stroke="#64748b" stroke-width="2.3"/>
  <rect x="384" y="348" width="512" height="83" rx="16" fill="#183b63"/>
  <text x="640" y="381" text-anchor="middle" class="heading" style="fill:white">Offline renderer</text>
  <text x="640" y="410" text-anchor="middle" class="mono" style="fill:#dceafa">scripts/render_voice_gateway.py</text>
  <path d="M640 431 V467" class="line"/>

  <rect x="48" y="471" width="1184" height="304" rx="20" fill="white" stroke="#adc1d4" stroke-width="2"/>
  <text x="70" y="507" class="heading">voice-node · 192.0.2.20</text>
  <text x="1210" y="507" text-anchor="end" class="small">One replica · Recreate · ≥180s grace · host network</text>

  <rect x="70" y="529" width="320" height="159" rx="14" fill="#fff1d9" stroke="#e6ba6d"/>
  <text x="90" y="562" class="heading">Init: stage private files</text>
  <text x="90" y="593" class="body">Immutable Secret → real files</text>
  <text x="90" y="624" class="mono">UID 10001 · dirs 0700</text>
  <text x="90" y="653" class="mono">.local/config/* · files 0600</text>
  <path d="M390 607 H426" class="line"/>

  <rect x="430" y="529" width="391" height="159" rx="14" fill="#e7eeff" stroke="#9db5e8"/>
  <text x="450" y="562" class="heading">Existing phone gateway</text>
  <text x="450" y="593" class="mono">/workspace stays image-owned</text>
  <text x="450" y="624" class="body">Full configuration; same API + callbacks</text>
  <rect x="450" y="642" width="234" height="28" rx="14" fill="#c9dbff"/>
  <text x="567" y="662" text-anchor="middle" class="small" style="font-weight:700">VOICE DISABLED BY DEFAULT</text>
  <path d="M821 607 H856" class="line"/>

  <rect x="860" y="529" width="350" height="159" rx="14" fill="#def5ee" stroke="#8bcbb7"/>
  <text x="880" y="562" class="heading">Same persistent storage</text>
  <text x="880" y="593" class="body">Gateway SQLite + preferences</text>
  <text x="880" y="624" class="body">Voice ownership + cleanup journals</text>
  <text x="880" y="653" class="small">Preserved through upgrade and rollback</text>

  <text x="70" y="728" class="body">Asterisk remains a separate workload. No second gateway and no automatic voice Start.</text>
  <text x="70" y="754" class="small">Readiness checks the listener; authenticated state and physical phone acceptance are separate checks.</text>

  <rect x="48" y="797" width="574" height="59" rx="14" fill="#e4edff"/>
  <text x="68" y="823" class="body">Example phone · 192.0.2.41</text>
  <text x="68" y="845" class="small">Existing callbacks; attended RTP only after explicit Start</text>
  <rect x="642" y="797" width="590" height="59" rx="14" fill="#f0e9ff"/>
  <text x="662" y="823" class="body">Example Home Assistant · 192.0.2.50</text>
  <text x="662" y="845" class="small">Existing API access; selected Assist pipeline during a session</text>
  <text x="48" y="882" class="small">192.0.2.0/24 addresses illustrate the design only. Supply your own reviewed LAN settings privately.</text>
</svg>
