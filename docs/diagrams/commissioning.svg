<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">One pilot phone before the full fleet</title><desc id="desc">Follow the intermediate upgrade steps required by the starting firmware. Confirm the resulting load on the phone screen.</desc><defs><marker id="arrow-48DDCC" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#48DDCC"/></marker><marker id="arrow-FF836D" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#FF836D"/></marker><marker id="arrow-F7CB64" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#F7CB64"/></marker></defs><rect width="1280" height="720" fill="#101C34"/><text x="45" y="55" font-family="Arial, sans-serif" font-size="34" fill="#F5F7FB" font-weight="700" text-anchor="start"><tspan x="45" dy="0">One pilot phone before the full fleet</tspan></text><path d="M335,255 L480,255" fill="none" stroke="#48DDCC" stroke-width="3"  marker-end="url(#arrow-48DDCC)"/><path d="M770,255 L915,255" fill="none" stroke="#48DDCC" stroke-width="3"  marker-end="url(#arrow-48DDCC)"/><path d="M1060,315 L1060,430" fill="none" stroke="#48DDCC" stroke-width="3"  marker-end="url(#arrow-48DDCC)"/><path d="M915,490 L770,490" fill="none" stroke="#48DDCC" stroke-width="3"  marker-end="url(#arrow-48DDCC)"/><path d="M480,490 L335,490" fill="none" stroke="#F7CB64" stroke-width="3"  marker-end="url(#arrow-F7CB64)"/><rect x="45" y="195" width="290" height="120" rx="10" fill="#172841" stroke="#F7CB64" stroke-width="2"/><text x="190" y="247" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="190" dy="0">Inventory</tspan><tspan x="190" dy="31.200000000000003">PID / HW / Load</tspan></text><rect x="480" y="195" width="290" height="120" rx="10" fill="#172841" stroke="#FF836D" stroke-width="2"/><text x="625" y="247" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="625" dy="0">Firmware path</tspan><tspan x="625" dy="31.200000000000003">SCCP to SIP</tspan></text><rect x="915" y="195" width="290" height="120" rx="10" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="1060" y="247" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="1060" dy="0">TFTP ready</tspan><tspan x="1060" dy="31.200000000000003">bundle + SEP XML</tspan></text><rect x="915" y="430" width="290" height="120" rx="10" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="1060" y="482" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="1060" dy="0">One pilot phone</tspan><tspan x="1060" dy="31.200000000000003">stable power</tspan></text><rect x="480" y="430" width="290" height="120" rx="10" fill="#172841" stroke="#48DDCC" stroke-width="2"/><text x="625" y="482" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="625" dy="0">Call tests</tspan><tspan x="625" dy="31.200000000000003">audio / DTMF / reboot</tspan></text><rect x="45" y="430" width="290" height="120" rx="10" fill="#172841" stroke="#F7CB64" stroke-width="2"/><text x="190" y="482" font-family="Arial, sans-serif" font-size="24" fill="#F5F7FB" font-weight="600" text-anchor="middle"><tspan x="190" dy="0">Remaining phones</tspan><tspan x="190" dy="31.200000000000003">one at a time</tspan></text><text x="45" y="660" font-family="Arial, sans-serif" font-size="19" fill="#AAB9D0" font-weight="400" text-anchor="start"><tspan x="45" dy="0">HW 13.0+ requires at least 9.3(1)SR3. The upgrade path depends on the current load.</tspan><tspan x="45" dy="24.7">Prepare TFTP and recovery before a reset. Keep power connected during flash writes.</tspan></text></svg>
