name: Optional wake image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      export_image:
        description: Export the verified public-code-only amd64 image for one day
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: optional-wake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Check out the exact event and full comparison history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prove whether the wake image is affected
        id: scope
        run: python3 scripts/voice_wake_scope.py

  build:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check private staging and shared reservation
        run: |
          python3 -m venv .venv
          .venv/bin/python -m unittest discover -s tests -p 'test_voice_wake_*.py' -v
          .venv/bin/python -m unittest discover -s tests -p 'test_render_voice_wake_job.py' -v
      # This rebuilds the base voice image that validate.yml also builds. The
      # two workflows run on separate runners, so the image cannot be shared,
      # and handing it over costs more than building it again: the base takes
      # about 38 seconds here and 37 seconds there, while saving, uploading,
      # downloading and loading the image takes 60-90 seconds and about 200 MB
      # of the shared artifact quota. The rebuild is not on the pull-request
      # critical path either, because the images job runs about eight minutes.
      # Keep the rebuild rather than adding a cross-workflow handoff.
      - name: Build and verify the manual base
        run: bash scripts/build-voice-image.sh cisco-wake-ci
      - name: Build and verify the optional wake layer
        run: |
          set -euo pipefail
          mkdir -p .build/wake-image-artifacts
          base_id=$(docker image inspect cisco-wake-ci/voice:pilot --format '{{.Id}}')
          bash scripts/build-voice-wake-image.sh \
            --base-image-id "$base_id" --base-source-ref "$GITHUB_SHA" \
            --tag cisco-wake-ci/voice-wake:pilot --platform linux/amd64 \
            | tee .build/wake-build.log
          tail -n 1 .build/wake-build.log > .build/wake-image-artifacts/receipt.json
          python3 -c 'import json; r=json.load(open(".build/wake-image-artifacts/receipt.json")); assert r["smoke_passed"] and not r["private_models_included"]'
      - name: Scan the complete wake runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: cisco-wake-ci/voice-wake:pilot
          format: json
          output: container-trivy.json
          scanners: vuln
          list-all-pkgs: true
          ignore-unfixed: false
          exit-code: '0'
      - name: Export complete image SBOM
        run: trivy convert --format cyclonedx --output container-sbom.cdx.json container-trivy.json
      - name: Reject actionable image vulnerabilities
        run: python3 scripts/verify_voice_security.py container-trivy.json
      - name: Preserve complete image security evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wake-security-evidence
          path: |
            container-trivy.json
            container-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Export the verified image
        if: inputs.export_image && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test "$(docker image inspect cisco-wake-ci/voice-wake:pilot --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          image_id=$(python3 -c 'import json; print(json.load(open(".build/wake-image-artifacts/receipt.json"))["image_id"])')
          test "$(docker image inspect cisco-wake-ci/voice-wake:pilot --format '{{.Id}}')" = "$image_id"
          docker image save cisco-wake-ci/voice-wake:pilot | gzip -9 > .build/wake-image-artifacts/voice-wake-amd64.tar.gz
          docker image inspect "$image_id" > .build/wake-image-artifacts/image.json
          printf '{"source_commit":"%s","run_id":"%s","platform":"linux/amd64"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .build/wake-image-artifacts/source.json
          cp container-trivy.json container-sbom.cdx.json .build/wake-image-artifacts/
          cd .build/wake-image-artifacts
          sha256sum voice-wake-amd64.tar.gz receipt.json image.json source.json container-trivy.json container-sbom.cdx.json > SHA256SUMS
          test "$(du -sb . | cut -f1)" -lt $((350 * 1024 * 1024))
      - name: Upload the bounded artifact
        if: inputs.export_image && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-voice-wake-amd64-${{ github.sha }}
          path: .build/wake-image-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  wake_gate:
    name: Wake gate
    needs: [scope, build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact gate implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require proven scope and successful applicable build
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          WAKE_REQUIRED: ${{ needs.scope.outputs.required }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: python3 scripts/voice_wake_scope.py --gate
