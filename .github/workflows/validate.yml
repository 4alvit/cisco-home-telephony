name: Validate and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      export_images:
        description: Export smoke-tested amd64 images for one deployment (1-day retention)
        type: boolean
        required: false
        default: false
      export_target:
        description: Image family to export within the per-run storage limit
        type: choice
        options:
          - pbx
          - voice
          - tftp
        required: false
        default: pbx
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify documentation links and anchors
        run: python3 scripts/verify_docs_links.py
      - name: Install public test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            'numpy>=1.26,<3' Pillow -r voice_assistant/requirements-websocket.txt
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          # Fail explicitly instead of silently skipping media and wake tests.
          # These tests use synthetic pixels/audio and injected ONNX sessions.
          .venv/bin/python -c 'import numpy; from PIL import Image; import aiohttp; import websockets.asyncio.client; assert Image.Resampling.LANCZOS'
          ffmpeg -version
          ffprobe -version
      - name: Python and shell checks
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python -m compileall -q scripts voice_assistant containers/asterisk tools/firmware_lab tools/sip_video tools/l16_lab
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Build and smoke-test the isolated voice runtime
        run: bash scripts/build-voice-image.sh cisco-home-ci
      - name: Verify speech codecs and artwork isolation in the final image
        run: |
          docker run --rm --pull never --network none --read-only \
            --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --entrypoint python3 -i cisco-home-ci/voice:pilot - < tests/test_voice_speech_codecs.py
      - name: Scan the complete voice runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: cisco-home-ci/voice:pilot
          format: json
          output: container-trivy.json
          scanners: vuln
          list-all-pkgs: true
          ignore-unfixed: false
          exit-code: '0'
      - name: Export complete image SBOM
        run: trivy convert --format cyclonedx --output container-sbom.cdx.json container-trivy.json
      - name: Reject actionable image vulnerabilities
        run: python3 scripts/verify_voice_security.py container-trivy.json
      - name: Preserve complete image security evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: voice-security-evidence
          path: |
            container-trivy.json
            container-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Export verified voice runtime
        if: github.event_name == 'workflow_dispatch' && inputs.export_images && inputs.export_target == 'voice' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p .build/voice-image-artifacts
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' cisco-home-ci/voice:pilot)" = linux/amd64
          docker image save cisco-home-ci/voice:pilot | gzip -9 > .build/voice-image-artifacts/voice-amd64.tar.gz
          docker image inspect cisco-home-ci/voice:pilot > .build/voice-image-artifacts/image.json
          printf '{"source_commit":"%s","run_id":"%s","platform":"linux/amd64"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .build/voice-image-artifacts/source.json
          cp container-trivy.json container-sbom.cdx.json .build/voice-image-artifacts/
          cd .build/voice-image-artifacts
          sha256sum voice-amd64.tar.gz image.json source.json container-trivy.json container-sbom.cdx.json > SHA256SUMS
          voice_bytes=$(du -sb . | cut -f1)
          printf 'Verified voice artifact size: %s bytes (limit: 250 MiB; only voice exported)\n' "$voice_bytes"
          test "$voice_bytes" -lt $((250 * 1024 * 1024))
      - name: Upload verified voice runtime
        if: github.event_name == 'workflow_dispatch' && inputs.export_images && inputs.export_target == 'voice' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-voice-amd64-${{ github.sha }}
          path: .build/voice-image-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Build both PBX images and verify binary versions
        run: bash scripts/build-images.sh cisco-home-ci
      - name: Verify firewall policies in disconnected network namespaces
        run: |
          docker build -t cisco-home-ci/firewall-test:bookworm - <<'DOCKERFILE'
          FROM cisco-home-ci/tftp:bookworm
          RUN apt-get update && apt-get install -y --no-install-recommends python3 iptables iproute2 \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          EXTERNAL_FIREWALL_TEST_IMAGE=cisco-home-ci/firewall-test:bookworm \
            .venv/bin/python -m unittest discover -s tests -p test_external_firewall.py -v
      - name: Isolated smoke with synthetic generated configuration
        run: bash scripts/smoke-containers.sh cisco-home-ci
      - name: Verify isolated L16 media and native call expiry
        run: |
          umask 077
          .venv/bin/python -m tools.l16_lab asterisk \
            --image cisco-home-ci/asterisk:22.11.0 \
            --docker-socket /var/run/docker.sock \
            --execute --output .local/l16/ci-1
          cat .local/l16/ci-1/report.json
      - name: Export verified amd64 images
        if: github.event_name == 'workflow_dispatch' && inputs.export_images && inputs.export_target == 'pbx' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p .build/image-artifacts
          for image in cisco-home-ci/asterisk:22.11.0 cisco-home-ci/tftp:bookworm; do
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          done
          docker image save cisco-home-ci/asterisk:22.11.0 | gzip -1 > .build/image-artifacts/asterisk-amd64.tar.gz
          docker image save cisco-home-ci/tftp:bookworm | gzip -1 > .build/image-artifacts/tftp-amd64.tar.gz
          docker image inspect cisco-home-ci/asterisk:22.11.0 cisco-home-ci/tftp:bookworm > .build/image-artifacts/images.json
          printf '{"source_commit":"%s","run_id":"%s","platform":"linux/amd64"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .build/image-artifacts/source.json
          cd .build/image-artifacts
          sha256sum asterisk-amd64.tar.gz tftp-amd64.tar.gz images.json source.json > SHA256SUMS
          total_bytes=$(du -sb . | cut -f1)
          printf 'Verified PBX image artifact size: %s bytes (limit: 400 MiB; only PBX exported)\n' "$total_bytes"
          test "$total_bytes" -lt $((400 * 1024 * 1024))
      - name: Upload verified amd64 images
        if: github.event_name == 'workflow_dispatch' && inputs.export_images && inputs.export_target == 'pbx' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-amd64-images-${{ github.sha }}
          path: .build/image-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Export verified TFTP image
        if: github.event_name == 'workflow_dispatch' && inputs.export_images && inputs.export_target == 'tftp' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p .build/tftp-image-artifacts
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' cisco-home-ci/tftp:bookworm)" = linux/amd64
          docker image save cisco-home-ci/tftp:bookworm | gzip -1 > .build/tftp-image-artifacts/tftp-amd64.tar.gz
          docker image inspect cisco-home-ci/tftp:bookworm > .build/tftp-image-artifacts/image.json
          printf '{"source_commit":"%s","run_id":"%s","platform":"linux/amd64"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .build/tftp-image-artifacts/source.json
          cd .build/tftp-image-artifacts
          sha256sum tftp-amd64.tar.gz image.json source.json > SHA256SUMS
          test "$(du -sb . | cut -f1)" -lt $((150 * 1024 * 1024))
      - name: Upload verified TFTP image
        if: github.event_name == 'workflow_dispatch' && inputs.export_images && inputs.export_target == 'tftp' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-tftp-amd64-${{ github.sha }}
          path: .build/tftp-image-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
