name: RC fuzz assessment
'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Explicit source candidate assessment
        type: choice
        required: true
        default: rc
        options: [rc]
permissions:
  contents: read
jobs:
  fuzz:
    if: ${{ github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'rc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/fuzz.yml@53ec91e4409900013d37a286a1db09d8910772be # main
    with:
      toolkit-ref: 1039e1057311b2912d755d0c684e73e2eeedecdc
      evidence-mode: candidate
