name: RC fuzz assessment
'on':
  workflow_dispatch:
    inputs:
      channel:
        description: Explicit source candidate assessment
        type: choice
        required: true
        default: rc
        options: [rc]
permissions:
  contents: read
jobs:
  fuzz:
    if: ${{ github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.event.inputs.channel == 'rc' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/fuzz.yml@6472c9fea1eb72f9c706548092036de36230b7aa # main
    with:
      toolkit-ref: 6472c9fea1eb72f9c706548092036de36230b7aa
      evidence-mode: candidate
